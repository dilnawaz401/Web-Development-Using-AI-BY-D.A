<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="iPhone-style calculator" />
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="calculator" role="application" aria-label="Calculator">
        <div class="app-label" aria-hidden="true">Aurora Calculator</div>
        <header class="display" aria-live="polite">
            <p class="display__expression" id="expression" aria-label="Expression"></p>
            <p class="display__value" id="display">0</p>
        </header>

        <div class="keys" role="group" aria-label="Keypad">
            <button type="button" class="key key--fn key--small-label" data-action="clear" aria-label="All clear">AC</button>
            <button type="button" class="key key--fn" data-action="sign" aria-label="Plus minus">±</button>
            <button type="button" class="key key--fn" data-action="percent" aria-label="Percent">%</button>
            <button type="button" class="key key--op" data-op="/" aria-label="Divide">÷</button>

            <button type="button" class="key key--num" data-digit="7" aria-label="7">7</button>
            <button type="button" class="key key--num" data-digit="8" aria-label="8">8</button>
            <button type="button" class="key key--num" data-digit="9" aria-label="9">9</button>
            <button type="button" class="key key--op" data-op="*" aria-label="Multiply">×</button>

            <button type="button" class="key key--num" data-digit="4" aria-label="4">4</button>
            <button type="button" class="key key--num" data-digit="5" aria-label="5">5</button>
            <button type="button" class="key key--num" data-digit="6" aria-label="6">6</button>
            <button type="button" class="key key--op" data-op="-" aria-label="Subtract">−</button>

            <button type="button" class="key key--num" data-digit="1" aria-label="1">1</button>
            <button type="button" class="key key--num" data-digit="2" aria-label="2">2</button>
            <button type="button" class="key key--num" data-digit="3" aria-label="3">3</button>
            <button type="button" class="key key--op" data-op="+" aria-label="Add">+</button>

            <button type="button" class="key key--num key--zero" data-digit="0" aria-label="0">0</button>
            <button type="button" class="key key--num" data-action="decimal" aria-label="Decimal">.</button>
            <button type="button" class="key key--op" data-action="equals" aria-label="Equals">=</button>
        </div>
    </div>
    <script src="calculator.js"></script>
</body>
</html>
